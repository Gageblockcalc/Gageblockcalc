<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gage block calculator for inch 81/36/28-piece and metric 112/88-piece sets. Classic digit-by-digit stacks with copy, share, and print ticket.">
  <meta name="theme-color" content="#0d6efd">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gage Blocks">
  <title>Gage Block Calculator</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <style>
    :root {
      --bg: #e9ecef;
      --card: #ffffff;
      --text: #212529;
      --muted: #6c757d;
      --border: #ced4da;
      --primary: #0d6efd;
      --primary-hover: #0b5ed7;
      --secondary: #6c757d;
      --secondary-hover: #5c636a;
      --success: #198754;
      --danger: #dc3545;
      --soft: #f8f9fa;
      --radius: 12px;
      --tap: 44px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 20px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: stretch;
    }

    .row > * { flex: 1 1 140px; }

    label.field-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input[type="number"],
    select.set-select {
      width: 100%;
      min-height: var(--tap);
      padding: 10px 12px;
      font-size: 1.05rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }

    input[type="number"]:focus,
    select.set-select:focus,
    .block-count:focus {
      outline: 2px solid rgba(13,110,253,0.35);
      border-color: var(--primary);
    }

    .set-note {
      font-size: 0.78rem;
      color: var(--muted);
      margin: -4px 0 0;
      line-height: 1.35;
    }

    .wear-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: var(--tap);
      padding: 4px 2px;
      user-select: none;
    }

    .wear-row input {
      width: 22px;
      height: 22px;
      accent-color: var(--primary);
    }

    .wear-row span {
      font-size: 0.98rem;
    }

    .collapsible-header {
      background: var(--soft);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: var(--tap);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: 600;
      touch-action: manipulation;
    }

    .collapsible-header:hover { background: #eef1f4; }

    .block-selection {
      display: none;
      max-height: 42vh;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .block-selection.open { display: block; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      position: sticky;
      top: 0;
      background: #fff;
      padding-bottom: 8px;
      z-index: 1;
    }

    .button {
      min-height: 40px;
      padding: 8px 14px;
      font-size: 0.95rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      touch-action: manipulation;
    }

    .button:hover { background: var(--primary-hover); }
    .button-secondary { background: var(--secondary); }
    .button-secondary:hover { background: var(--secondary-hover); }

    .block-item {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      padding: 4px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .block-item:last-child { border-bottom: none; }

    .block-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      accent-color: var(--primary);
    }

    .block-item label {
      flex: 1;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
    }

    select.block-count {
      width: 64px;
      min-height: 36px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px;
    }

    .results { min-height: 80px; }

    .hint, .loading, .error, .meta {
      text-align: center;
      padding: 12px 8px;
      font-size: 0.95rem;
    }

    .hint, .meta { color: var(--muted); }
    .loading { color: var(--primary); font-weight: 600; }
    .error { color: var(--danger); font-weight: 600; }

    .combination {
      background: var(--soft);
      border-radius: 8px;
      border-left: 4px solid var(--success);
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .combo-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .badge {
      background: #e7f1ff;
      color: var(--primary);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .verify.ok { color: var(--success); font-weight: 700; }
    .verify.bad { color: var(--danger); font-weight: 700; }

    .combo-body {
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
      line-height: 1.45;
      word-break: break-word;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      padding-top: 4px;
    }

    @media (max-width: 420px) {
      body { padding: 0; }
      .container {
        border-radius: 0;
        min-height: 100vh;
        box-shadow: none;
      }
      h1 { font-size: 1.25rem; }
    }

    .install-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: #e7f1ff;
      border: 1px solid #b6d4fe;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .install-bar.visible { display: flex; }

    .install-bar p {
      margin: 0;
      flex: 1;
      color: var(--text);
      line-height: 1.35;
    }

    .install-bar .button {
      flex-shrink: 0;
      min-height: 36px;
      padding: 6px 12px;
      font-size: 0.88rem;
    }

    .install-dismiss {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      padding: 4px 6px;
      min-width: 32px;
      min-height: 32px;
    }

    .install-dismiss:hover { color: var(--text); }

    @media (display-mode: standalone) {
      .install-bar { display: none !important; }
    }

    .combination.primary {
      border-left-width: 5px;
      border-left-color: var(--primary);
      background: #f0f6ff;
      box-shadow: 0 1px 4px rgba(13,110,253,0.12);
    }

    .badge.primary-badge {
      background: var(--primary);
      color: #fff;
    }

    .combo-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .button-tiny {
      min-height: 34px;
      padding: 5px 12px;
      font-size: 0.85rem;
    }

    .button.copied {
      background: var(--success);
    }

    .print-ticket {
      display: none;
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
        display: block;
      }

      .install-bar,
      .no-print,
      .combo-actions,
      .collapsible-header,
      .block-selection,
      .wear-row {
        display: none !important;
      }

      body.printing-ticket .container {
        display: none !important;
      }

      body.printing-ticket .print-ticket {
        display: block !important;
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        padding: 24px;
        color: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }

      .ticket-inner h2 {
        margin: 0 0 16px;
        font-size: 1.35rem;
        text-align: center;
        border-bottom: 2px solid #000;
        padding-bottom: 8px;
      }

      .ticket-inner dl {
        margin: 0;
      }

      .ticket-inner dt {
        font-weight: 700;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #444;
        margin-top: 12px;
      }

      .ticket-inner dd {
        margin: 2px 0 0;
        font-size: 1.05rem;
        font-variant-numeric: tabular-nums;
      }

      .ticket-blocks {
        margin: 4px 0 0;
        padding-left: 1.2em;
      }

      .ticket-stack {
        font-weight: 600;
        word-break: break-word;
      }

      .ticket-footer {
        margin-top: 24px;
        text-align: center;
        font-size: 0.8rem;
        color: #555;
        border-top: 1px solid #ccc;
        padding-top: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gage Block Calculator</h1>

    <div>
      <label class="field-label" for="setSelect">Block set</label>
      <select id="setSelect" class="set-select" aria-label="Gage block set"></select>
      <p class="set-note" id="setNote"></p>
    </div>

    <div>
      <label class="field-label" for="target">Target</label>
      <input type="number" id="target" inputmode="decimal" min="0" step="0.0001"
        placeholder="Target dimension" aria-label="Target dimension">
    </div>

    <label class="wear-row" for="wearToggle">
      <input type="checkbox" id="wearToggle">
      <span id="wearLabelText">Include wear / protection blocks</span>
    </label>

    <div class="collapsible-header" id="blockHeader" role="button" tabindex="0"
      aria-controls="blockSelection" aria-expanded="false">
      <span>Available blocks</span>
      <span class="chevron">▼</span>
    </div>
    <div class="block-selection" id="blockSelection"></div>

    <div class="results" id="results" aria-live="polite"></div>

    <div class="install-bar" id="installPrompt" hidden>
      <p>Install this app for quick access offline.</p>
      <button type="button" class="button" id="installBtn">Install app</button>
      <button type="button" class="install-dismiss" id="installDismiss" aria-label="Dismiss">×</button>
    </div>

    <div class="install-bar" id="iosTip" hidden>
      <p>On iPhone/iPad: tap Share, then <strong>Add to Home Screen</strong>.</p>
      <button type="button" class="install-dismiss" id="iosTipDismiss" aria-label="Dismiss tip">×</button>
    </div>

    <div class="footer">Made by Nicholas Duncan 2025</div>
  </div>

  <div class="print-ticket" id="printTicket" aria-hidden="true"></div>

  <script src="algorithm.js"></script>
  <script src="app.js"></script>
</body>
</html>
